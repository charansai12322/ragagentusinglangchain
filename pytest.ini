[pytest]
asyncio_mode = auto
pythonpath = .
testpaths = backend/app/tests
markers =
    live_provider: Live Groq API tests (opt-in only, consumes real quota)
    integration: End-to-end API lifecycle scenarios
    security: SSRF and input attack validation
    concurrency: Concurrency and race condition tests
addopts = -m "not live_provider"
