# Ruff configuration
target-version = "py312"
line-length = 120

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # Allow Depends(...) and File(...) in FastAPI route parameter defaults
]

[lint.isort]
known-first-party = ["backend"]
